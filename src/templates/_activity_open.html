{# The link that opens the activity. It sits outside the activity's section, so it names the
   attributes the renderer sets in data-morph-keep and an in-place update leaves its state alone. #}
<button type="button" class="ac-open" id="ac-open" aria-expanded="false" aria-controls="ac-body" data-morph-keep="hidden aria-expanded">Activity ▸</button>
