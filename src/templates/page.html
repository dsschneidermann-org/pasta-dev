{% extends "_nav.html" %}

{% block title %}{{ workspace_name }}{% endblock %}

{% block main %}
    {{ body | safe }}

    <hr />
    <div id="page-actions" style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
        <form id="archive-form" method="post"
              action="/{{ workspace_id }}/page/{{ page_id }}/{% if archived %}unarchive{% else %}archive{% endif %}">
            <button type="submit">{% if archived %}Unarchive page{% else %}Archive page{% endif %}</button>
        </form>
        {% if statuses %}
        {# Direct state override: pick any of the type's FSM states and Apply (POSTs to /status). #}
        <form id="status-form" method="post" style="display: flex; align-items: center;"
              action="/{{ workspace_id }}/page/{{ page_id }}/status">
            <label for="status-select">State:</label>
            <select id="status-select" name="status">
                {% for state in statuses %}
                <option value="{{ state }}"{% if state == status %} selected{% endif %}>{{ state }}</option>
                {% endfor %}
            </select>
            <button type="submit">Apply</button>
        </form>
        {% endif %}
    </div>
    <script>
        document.getElementById("archive-form").addEventListener("submit", function(event) {
            window.scrollTo(0, 0);
        })
        document.getElementById("status-form").addEventListener("submit", function(event) {
            window.scrollTo(0, 0);
        })
    </script>
{% endblock %}
