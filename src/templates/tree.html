{% extends "_base.html" %}

{% block title %}{{ workspace_name }}{% endblock %}

{% block content %}
{{d}}
    {% if show_archived %}
    <a href="{{ request.url.path }}">Hide archived</a>
    {% else %}
    <a href="{{ request.url.path }}?archived=true">Show archived</a>
    {% endif %}
    <a href="/{{ workspace_id }}/timeline">Timeline</a>

    {{ body | safe }}
{% endblock %}
