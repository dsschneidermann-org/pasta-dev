[project]
name = "pasta-project"
version = "0.1.0"
description = "pasta MCP server - a structured wiki over MCP (FastMCP + python-statemachine, file storage)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "fastmcp>=3.4.4",
    "hmr>=0.7.6.3",
    "jinja2>=3.1.6",
    "myst-parser>=5.1.0",
    "pydot>=4.0.1",
    "python-statemachine>=3.2.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinxcontrib-mermaid>=2.1.0",
    "wenmode>=0.12.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "pytest>=9.1.1",
    "pytest-testmon>=2.2.0",
    "sphinx-autobuild>=2025.8.25",
]
docs = [
    "sphinx>=8.1",
    "myst-parser>=4.0",
    "sphinxcontrib-mermaid>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "recommended"
reportAny = false
reportExplicitAny = false
include = ["src/**/*"]
